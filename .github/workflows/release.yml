name: Release

# Runs when you push a tag like v1.0.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Attach jar to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true

      # --- Optional: auto-publish to CurseForge and Modrinth -------------------
      # Delete this step if you'd rather upload by hand the first few times.
      #
      # Add these under Settings -> Secrets and variables -> Actions:
      #   CURSEFORGE_TOKEN  - from https://legacy.curseforge.com/account/api-tokens
      #   MODRINTH_TOKEN    - from https://modrinth.com/settings/pats (needs "Create versions")
      # And set CURSEFORGE_ID / MODRINTH_ID below to your project IDs.
      - name: Publish to CurseForge and Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        if: ${{ env.CURSEFORGE_TOKEN != '' }}
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        with:
          curseforge-id: 000000
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-id: xxxxxxxx
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: build/libs/!(*-sources|*-javadoc).jar
          name: AirPlace ${{ github.ref_name }}
          version-type: release
          loaders: neoforge
          game-versions: 1.21.1
          java: 21
